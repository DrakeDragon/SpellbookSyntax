<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0a1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Spellbook Syntax</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0a1a; --bg2:#12102a; --card:#171433; --card2:#1d1a40; --line:#2c2860;
  --text:#ece8ff; --muted:#9a94c9; --gold:#ffcf5a; --gold2:#ff9f43; --teal:#27d3b9; --purple:#7c5cff;
  --red:#ff5d73; --green:#4be08a; --sky1:#1a1450; --sky2:#3b2a8f; --accent:#ffcf5a;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --serif:'Cinzel',Georgia,'Times New Roman',serif;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:16px;line-height:1.5;overscroll-behavior-y:none}
body{min-height:100vh;min-height:100dvh}
#app{max-width:560px;margin:0 auto;min-height:100dvh;position:relative;padding-bottom:calc(76px + var(--sab))}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
code{font-family:var(--mono);background:#0e0c26;border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:.88em;color:#ffd98a}
b{color:#fff}
p{margin:.55em 0}
h1,h2,h3{font-family:var(--serif);margin:0;letter-spacing:.02em}

/* HUD */
#hud{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:calc(8px + var(--sat)) 12px 8px;background:linear-gradient(#0b0a1af2,#0b0a1ad9);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.lvl{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 30% 25%,#ffe29a,#ff9f43 70%);color:#2a1700;font-family:var(--serif);font-weight:800;font-size:18px;box-shadow:0 0 0 3px #2a1700,0 0 18px #ffcf5a66}
.hudmid{flex:1;min-width:0}
.hudtop{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.hudname{font-family:var(--serif);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hudmp{color:var(--muted);font-size:12px;white-space:nowrap}
.bar{height:9px;border-radius:99px;background:#0e0c26;border:1px solid var(--line);overflow:hidden;margin-top:5px}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--gold));border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.hudbtn{flex:none;width:36px;height:36px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:16px}
.py{flex:none;font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px}
.py i{width:8px;height:8px;border-radius:50%;background:#ffb84a;display:inline-block;animation:pulse 1s infinite}
.py.ok i{background:var(--green);animation:none}
.py.bad i{background:var(--red);animation:none}

/* Dock */
#dock{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;z-index:40;display:flex;background:#0e0c26f2;backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 6px calc(6px + var(--sab))}
#dock button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 2px;border-radius:12px;color:var(--muted);font-size:11px}
#dock button span{font-size:20px;line-height:1.1}
#dock button.on{color:var(--gold);background:#ffffff0d}

/* Layout bits */
.view{padding:12px 14px 20px}
.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:18px;padding:14px;margin:12px 0;box-shadow:0 6px 24px #0006}
.card h2{font-size:18px;margin-bottom:6px}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:14px;font-weight:700;background:linear-gradient(180deg,var(--gold),var(--gold2));color:#2a1700;box-shadow:0 4px 0 #a05a12,0 8px 20px #ff9f4344;transition:transform .08s,box-shadow .08s,opacity .2s;min-height:48px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #a05a12}
.btn[disabled]{opacity:.4;pointer-events:none;filter:grayscale(.6)}
.btn.block{width:100%}
.btn.ghost{background:var(--card2);color:var(--text);box-shadow:0 3px 0 #0006;border:1px solid var(--line)}
.btn.teal{background:linear-gradient(180deg,#52f0d6,var(--teal));color:#032a24;box-shadow:0 4px 0 #107a6b,0 8px 20px #27d3b944}
.btn.small{padding:8px 12px;min-height:38px;font-size:14px;border-radius:12px}
.tag{display:inline-block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);border:1px solid #ffcf5a55;border-radius:99px;padding:2px 9px}

/* Scene */
.scene{position:relative;border-radius:20px;overflow:hidden;border:1px solid var(--line);box-shadow:0 8px 30px #0008;background:linear-gradient(var(--sky1),var(--sky2))}
.scene svg{display:block;width:100%;height:auto}
.scene .star{animation:twinkle 3s infinite ease-in-out}
.scene .rune{font-family:var(--mono);fill:#ffffff40;animation:floatup 9s linear infinite}
.sudo{cursor:pointer}
.sudo .tail{transform-origin:12px 70px;animation:wag 2.4s ease-in-out infinite}
.sudo .eyes-happy,.sudo .eyes-shock,.sudo .m-happy,.sudo .m-sad,.sudo .m-shock,.sudo .brows{display:none}
.scene[data-mood=happy] .eyes-idle{display:none}.scene[data-mood=happy] .eyes-happy{display:inline}
.scene[data-mood=happy] .m-idle{display:none}.scene[data-mood=happy] .m-happy{display:inline}
.scene[data-mood=sad] .m-idle{display:none}.scene[data-mood=sad] .m-sad{display:inline}.scene[data-mood=sad] .brows{display:inline}
.scene[data-mood=shock] .eyes-idle{display:none}.scene[data-mood=shock] .eyes-shock{display:inline}
.scene[data-mood=shock] .m-idle{display:none}.scene[data-mood=shock] .m-shock{display:inline}
.scene[data-mood=happy] .sudo{animation:hop .5s ease-out}
.scene[data-mood=shock] .sudo{animation:shake .4s}
.bubble{position:absolute;left:10px;right:118px;top:10px;background:#fffdf5;color:#26203d;border-radius:14px;padding:9px 12px;font-size:14px;line-height:1.35;box-shadow:0 4px 14px #0006;min-height:40px}
.bubble:after{content:"";position:absolute;right:-9px;top:20px;border:9px solid transparent;border-left-color:#fffdf5;border-right:0}
.bubble b{color:#5b3fd1}
.bubble .who{display:block;font-family:var(--serif);font-weight:800;font-size:11px;letter-spacing:.1em;color:#7c5cff;margin-bottom:1px}

/* Map */
.hero h1{font-size:26px;line-height:1.15;margin:14px 2px 2px}
.hero .sub{color:var(--muted);margin:0 2px 10px}
.realm{margin:14px 0}
.realm h3{font-size:15px;color:var(--gold);display:flex;justify-content:space-between;align-items:baseline;margin:0 2px 8px}
.realm h3 small{font-family:system-ui;color:var(--muted);font-size:12px}
.nodes{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.node{aspect-ratio:1;border-radius:16px;display:grid;place-items:center;font-weight:800;font-size:17px;background:var(--card);border:2px solid var(--line);color:var(--muted);position:relative}
.node.done{background:linear-gradient(180deg,#3a2f12,#2a2208);border-color:var(--gold);color:var(--gold)}
.node.cur{background:linear-gradient(180deg,#2b2575,#1d1a50);border-color:var(--purple);color:#fff;animation:glow 1.6s infinite}
.node.boss{border-radius:50%}
.node.locked{opacity:.45}
.node small{position:absolute;bottom:2px;font-size:9px;opacity:.8}
.teaser{border-style:dashed;text-align:center;color:var(--muted)}

/* Lesson */
.pips{display:flex;gap:6px;margin:12px 0 4px}
.pip{flex:1;height:6px;border-radius:99px;background:#0e0c26;border:1px solid var(--line)}
.pip.on{background:var(--gold);border-color:var(--gold)}
.pip.cur{background:var(--purple);border-color:var(--purple);animation:pulse 1.4s infinite}
.steptitle{display:flex;align-items:center;justify-content:space-between;margin:6px 2px}
.steptitle h2{font-size:19px}
.analogy{border-left:3px solid var(--teal);background:#27d3b911;padding:8px 12px;border-radius:0 12px 12px 0;margin:10px 0;color:#bff7ee}
.codeblk,.pre{font-family:var(--mono);background:#0a0820;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0;overflow:auto;font-size:14px;line-height:1.55;white-space:pre;color:#e8e4ff}
.opts{display:grid;gap:9px;margin:12px 0}
.opt{text-align:left;padding:12px 14px;border-radius:14px;background:var(--card2);border:2px solid var(--line);font-weight:600;transition:transform .08s,border-color .15s;min-height:48px}
.opt:active{transform:scale(.985)}
.opt.good{border-color:var(--green);background:#4be08a22}
.opt.bad{border-color:var(--red);background:#ff5d7322;animation:shake .35s}
.opt[disabled]{pointer-events:none}
.note{margin:10px 0;padding:10px 12px;border-radius:12px;background:#ffffff0a;border:1px solid var(--line);font-size:14px}
.note.good{border-color:#4be08a66;background:#4be08a14}
.note.bad{border-color:#ff5d7366;background:#ff5d7314}
.checklist{list-style:none;padding:0;margin:10px 0;display:grid;gap:6px}
.checklist li{display:flex;gap:9px;align-items:flex-start;font-size:14px;padding:7px 10px;border-radius:10px;background:#ffffff08;border:1px solid var(--line)}
.checklist li.ok{border-color:#4be08a66;background:#4be08a14}
.checklist li.no{border-color:#ff5d7366;background:#ff5d7314}
.nav{display:flex;gap:10px;margin-top:14px}
.nav .btn{flex:1}

/* Editor */
.ed{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#0a0820;margin:10px 0}
.ed-main{display:flex}
.ed-gutter{margin:0;padding:10px 8px 10px 10px;font:16px/24px var(--mono);color:#5d588f;text-align:right;user-select:none;background:#0d0a28;border-right:1px solid var(--line);min-width:34px}
.ed-code{position:relative;flex:1;min-width:0;overflow:hidden}
.ed-hl,.ed-ta{position:absolute;left:0;top:0;width:100%;height:100%;margin:0;padding:10px 12px;font:16px/24px var(--mono);white-space:pre;tab-size:4;letter-spacing:0;border:0;outline:0}
.ed-hl{overflow:hidden;pointer-events:none;color:#e8e4ff}
.ed-ta{background:transparent;color:transparent;caret-color:#fff;resize:none;overflow-x:auto;overflow-y:hidden;-webkit-text-fill-color:transparent;-webkit-appearance:none;border-radius:0}
.ed-ta::selection{background:#7c5cff66;-webkit-text-fill-color:transparent}
.ed-sizer{visibility:hidden;white-space:pre;font:16px/24px var(--mono);padding:10px 12px;min-height:44px}
.tk-c{color:#6f6aa8;font-style:italic}.tk-s{color:#7ff0a8}.tk-n{color:#ffb86b}.tk-k{color:#c792ff}.tk-f{color:#6cc9ff}
.runes{display:flex;gap:6px;overflow-x:auto;padding:7px 8px;background:#0d0a28;border-top:1px solid var(--line);scrollbar-width:none}
.runes::-webkit-scrollbar{display:none}
.rune-btn{flex:none;min-width:40px;height:36px;padding:0 10px;border-radius:10px;background:var(--card2);border:1px solid var(--line);font-family:var(--mono);font-size:15px;color:var(--gold)}
.rune-btn:active{background:var(--purple)}
.inputs{margin:8px 0}
.files{margin:8px 0;border:1px solid var(--line);border-radius:12px;background:#0d0a28;font-size:13px}
.files summary{padding:8px 12px;cursor:pointer;color:var(--muted)}
.files .file{padding:0 12px 8px}.files .file b{font-family:var(--mono);color:#ffe27a;font-size:12px}
.files .file pre{margin:4px 0 0;padding:8px 10px;border-radius:8px;background:#06051a;font:13px/1.45 var(--mono);white-space:pre-wrap;word-break:break-word;color:#d8f7e5;max-height:160px;overflow:auto}
.inputs label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}
.inputs textarea{width:100%;min-height:54px;background:#0a0820;border:1px solid var(--line);border-radius:12px;color:var(--text);font:16px/24px var(--mono);padding:8px 12px;resize:vertical}
.out{margin:10px 0;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#06051a}
.out .oh{display:flex;justify-content:space-between;padding:6px 12px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);background:#0d0a28;border-bottom:1px solid var(--line)}
.out pre{margin:0;padding:10px 12px;font:14px/1.5 var(--mono);white-space:pre-wrap;word-break:break-word;color:#d8f7e5;min-height:20px;max-height:260px;overflow:auto}
.out pre.err{color:#ff9aa8}
.out .help{padding:10px 12px;border-top:1px solid var(--line);font-size:14px;background:#1a0f26;color:#ffd0d8}
.out .help b{color:#fff}
.hintbox{margin:8px 0;padding:10px 12px;border-radius:12px;background:#ffcf5a14;border:1px solid #ffcf5a55;font-size:14px}
.hintbox .pre{margin:6px 0 0}

/* Boss */
.boss-hud{margin:10px 0;padding:10px 12px;border-radius:16px;background:linear-gradient(180deg,#2a1230,#1a0d26);border:1px solid #ff5d7355}
.boss-hud .nm{font-family:var(--serif);font-weight:800;color:#ffb3be;display:flex;justify-content:space-between}
.boss-hud .bar>i{background:linear-gradient(90deg,#ff5d73,#ff9f43)}

/* Power-up */
.powers{display:grid;gap:10px;margin:10px 0}
.pu{padding:12px;border-radius:14px;border:1px solid var(--line);background:#ffffff08}
.pu h4{margin:0 0 4px;font-family:var(--serif);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--teal)}
.pu ul{margin:4px 0 0;padding-left:18px}
.mpgain{font-family:var(--serif);font-size:30px;color:var(--gold);text-align:center;margin:6px 0}

/* Lists */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cx{padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--card);text-align:left;width:100%}
.cx.locked{opacity:.4}
.cx h4{margin:0;font-size:15px;font-family:var(--serif)}
.cx .meta{font-size:11px;color:var(--muted)}
.ach{display:flex;gap:12px;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--card);margin:8px 0;align-items:flex-start}
.ach .ic{flex:none;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:#0e0c26;border:2px solid var(--line)}
.ach.have .ic{border-color:var(--gold);box-shadow:0 0 14px #ffcf5a44}
.ach.bronze.have .ic{border-color:#cd8b4a}.ach.silver.have .ic{border-color:#c9d3e8}.ach.gold.have .ic{border-color:var(--gold)}
.ach:not(.have){opacity:.55}
.ach h4{margin:0;font-size:15px}
.ach .pr{font-size:12px;color:var(--teal);margin-top:3px}
.ach .d{font-size:13px;color:var(--muted)}
.mon{padding:10px;border-radius:14px;border:1px dashed var(--line);text-align:center;background:var(--card);font-size:12px}
.mon .e{font-size:30px;filter:grayscale(1) brightness(.4)}
.mon.have{border-style:solid;border-color:#ff5d7366}
.mon.have .e{filter:none}
.ladder{display:grid;gap:6px}
.lv{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:13px}
.lv .n{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--serif);font-weight:800;background:#0e0c26;border:2px solid var(--line)}
.lv.have .n{background:var(--gold);color:#2a1700;border-color:var(--gold)}
.lv.cur{border-color:var(--purple)}
.lv:not(.have){opacity:.55}

/* Overlays + toasts */
#overlay{position:fixed;inset:0;z-index:100;display:none;place-items:center;background:#05040fd9;backdrop-filter:blur(6px);padding:20px}
#overlay.on{display:grid}
.modal{width:100%;max-width:440px;max-height:92dvh;overflow:auto;background:linear-gradient(180deg,#241e5e,#14112f);border:2px solid var(--gold);border-radius:24px;padding:20px;text-align:center;box-shadow:0 0 60px #ffcf5a44;animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
.modal h2{font-size:26px;color:var(--gold)}
.modal .big{font-family:var(--serif);font-weight:800;font-size:84px;line-height:1;color:var(--gold);text-shadow:0 0 30px #ffcf5a88;margin:6px 0}
.modal ul{text-align:left;margin:8px 0 14px;padding-left:20px}
#toasts{position:fixed;top:calc(64px + var(--sat));left:0;right:0;z-index:90;display:grid;gap:8px;justify-items:center;pointer-events:none;padding:0 12px}
.toast{display:flex;gap:12px;align-items:center;max-width:420px;width:100%;padding:10px 14px;border-radius:16px;background:linear-gradient(180deg,#2c2575,#1b1750);border:1px solid var(--gold);box-shadow:0 8px 30px #000a;animation:slidein .4s cubic-bezier(.2,1.3,.4,1)}
.toast.out{animation:slideout .35s forwards}
.toast .ic{font-size:28px}
.toast b{display:block;font-family:var(--serif);color:var(--gold)}
.toast span{font-size:13px;color:var(--muted)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:120}

.loadbox{text-align:center;padding:30px 10px}
.spin{width:44px;height:44px;border:4px solid var(--line);border-top-color:var(--gold);border-radius:50%;margin:10px auto;animation:spin 1s linear infinite}
.settings .row{justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.switch{width:52px;height:30px;border-radius:99px;background:#0e0c26;border:1px solid var(--line);position:relative}
.switch:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:.2s}
.switch.on{background:var(--teal)}.switch.on:after{left:25px;background:#fff}
input[type=text],.field{width:100%;padding:12px 14px;border-radius:12px;background:#0a0820;border:1px solid var(--line);color:var(--text);font:inherit;font-size:16px}
textarea.field{font-family:var(--mono);font-size:13px;min-height:90px}

@keyframes pulse{50%{opacity:.45}}
@keyframes twinkle{50%{opacity:.2}}
@keyframes floatup{from{transform:translateY(0);opacity:0}15%{opacity:1}to{transform:translateY(-170px);opacity:0}}
@keyframes wag{50%{transform:rotate(9deg)}}
@keyframes hop{30%{transform:translateY(-14px)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes glow{50%{box-shadow:0 0 18px #7c5cffaa}}
@keyframes pop{from{transform:scale(.6);opacity:0}}
@keyframes slidein{from{transform:translateY(-30px);opacity:0}}
@keyframes slideout{to{transform:translateY(-30px);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="app">
  <header id="hud"></header>
  <main id="view"></main>
  <nav id="dock"></nav>
</div>
<div id="toasts"></div>
<div id="overlay"></div>
<canvas id="fx"></canvas>

<script>
(()=>{
'use strict';
/* =================================================================
   SPELLBOOK SYNTAX — engine (Stage 9: Realms 0–14)
   Lessons are data (LESSONS). The engine never changes per lesson.
   ================================================================= */
const PYO = 'https://cdn.jsdelivr.net/pyodide/v0.27.7/full/';
const RUNNER_PY = __RUNNER_JSON__;
const LESSONS = __LESSONS_JSON__;
const SAVE_KEY = 'spellbook-syntax-v1';

/* ---------- tiny helpers ---------- */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
function h(tag, a, ...kids){
  const e = document.createElement(tag);
  if (a) for (const k in a){
    const v = a[k];
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat(Infinity)){ if (c == null || c === false) continue; e.append(c.nodeType ? c : document.createTextNode(c)); }
  return e;
}
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const clamp = (n,a,b) => Math.max(a, Math.min(b, n));
const todayStr = () => { const d = new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); };

/* ---------- code highlighting ---------- */
const KW = 'and|or|not|in|is|if|elif|else|for|while|def|return|import|from|as|True|False|None|break|continue|pass|class|try|except|finally|with|lambda|match|case';
const BI = 'print|input|int|float|str|type|round|abs|min|max|len|range|sum|sorted|list|dict|set|tuple|bool';
const HL_RE = new RegExp('(#[^\\n]*)|("(?:[^"\\\\\\n]|\\\\.)*"?|\'(?:[^\'\\\\\\n]|\\\\.)*\'?)|(\\b\\d+(?:\\.\\d+)?\\b)|(\\b(?:'+KW+')\\b)|(\\b(?:'+BI+')\\b(?=\\())', 'g');
function hl(code){
  let out = '', last = 0, m;
  HL_RE.lastIndex = 0;
  while ((m = HL_RE.exec(code))){
    out += esc(code.slice(last, m.index));
    const cls = m[1] ? 'c' : m[2] ? 's' : m[3] ? 'n' : m[4] ? 'k' : 'f';
    out += '<span class="tk-'+cls+'">'+esc(m[0])+'</span>';
    last = m.index + m[0].length;
    if (m[0].length === 0) HL_RE.lastIndex++;
  }
  return out + esc(code.slice(last));
}
function inlineMd(t){
  const codes = [];
  t = esc(t).replace(/`([^`]+)`/g, (m,c) => { codes.push(c); return '\u0000'+(codes.length-1)+'\u0000'; });
  t = t.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/\*([^*\n]+)\*/g, '<i>$1</i>');
  t = t.replace(/\u0000(\d+)\u0000/g, (m,i) => '<code>'+codes[+i]+'</code>');
  return t.split(/\n\n+/).map(block => {
    let html = '', list = [];
    const flush = () => { if (list.length){ html += '<ul>'+list.map(x => '<li>'+x+'</li>').join('')+'</ul>'; list = []; } };
    let para = [];
    const flushP = () => { if (para.length){ html += '<p>'+para.join('<br>')+'</p>'; para = []; } };
    block.split('\n').forEach(line => { if (/^- /.test(line)){ flushP(); list.push(line.slice(2)); } else { flush(); para.push(line); } });
    flush(); flushP(); return html;
  }).join('');
}
function md(s){
  return String(s).split(/```\n?/).map((p,i) => i%2 ? '<pre class="codeblk">'+hl(p.replace(/\n$/,''))+'</pre>' : inlineMd(p)).join('');
}

const fx = {
  c:null, x:null, ps:[], on:false,
  init(){ this.c = $('#fx'); this.x = this.c.getContext && this.c.getContext('2d'); this.size(); addEventListener('resize', () => this.size()); },
  size(){ if (!this.c) return; const d = devicePixelRatio||1; this.c.width = innerWidth*d; this.c.height = innerHeight*d; if (this.x) this.x.setTransform(d,0,0,d,0,0); },
  burst(x, y, o={}){
    if (!this.x || (typeof matchMedia === 'function' && matchMedia('(prefers-reduced-motion: reduce)').matches)) return;
    const n = o.n||24, cols = o.colors||['#ffcf5a','#27d3b9','#7c5cff'], sp = o.spread||4;
    for (let i=0;i<n;i++){ const a = Math.random()*Math.PI*2, v = (.4+Math.random())*sp;
      this.ps.push({x, y, vx:Math.cos(a)*v, vy:Math.sin(a)*v - (o.up||1.5), life:50+Math.random()*30, c:pick(cols), s:2+Math.random()*3.5, g:o.g==null?.12:o.g}); }
    if (!this.on){ this.on = true; requestAnimationFrame(() => this.tick()); }
  },
  tick(){
    const x = this.x; x.clearRect(0,0,innerWidth,innerHeight);
    this.ps = this.ps.filter(p => p.life > 0);
    for (const p of this.ps){ p.x += p.vx; p.y += p.vy; p.vy += p.g; p.life--; x.globalAlpha = clamp(p.life/40,0,1); x.fillStyle = p.c; x.fillRect(p.x, p.y, p.s, p.s); }
    x.globalAlpha = 1;
    if (this.ps.length) requestAnimationFrame(() => this.tick()); else { this.on = false; x.clearRect(0,0,innerWidth,innerHeight); }
  }
};

/* ---------- Python runner (Pyodide in a Web Worker) ---------- */
const Py = {
  state:'idle', worker:null, main:null, waiters:[], pending:{}, seq:0, error:'',
  onChange(){ updatePyChip(); },
  init(){
    if (window.__PYRUN__){ this.main = window.__PYRUN__; this.state = 'ready'; this.onChange(); return; }
    this.state = 'loading'; this.onChange();
    let ok = false;
    try { ok = this.startWorker(); } catch(e){ ok = false; }
    if (!ok) this.startMain();
  },
  startWorker(){
    if (!window.Worker || !window.Blob || !window.URL) return false;
    const src = 'importScripts("'+PYO+'pyodide.js");let run_job;'
      + 'const boot=(async()=>{const py=await loadPyodide({indexURL:"'+PYO+'"});self.__py=py;py.runPython('+JSON.stringify(RUNNER_PY)+');run_job=py.globals.get("run_job");postMessage({t:"ready"});})().catch(e=>postMessage({t:"fail",m:String(e)}));'
            + 'onmessage=async e=>{await boot;const d=e.data;try{try{await self.__py.loadPackagesFromImports(JSON.parse(d.job).code)}catch(pe){}postMessage({t:"res",id:d.id,out:run_job(d.job)})}catch(err){postMessage({t:"res",id:d.id,err:String(err)})}};';
    const url = URL.createObjectURL(new Blob([src], {type:'text/javascript'}));
    const w = new Worker(url); this.worker = w;
    w.onmessage = ev => {
      const m = ev.data;
      if (m.t === 'ready'){ this.state = 'ready'; this.waiters.splice(0).forEach(f => f()); this.onChange(); }
      else if (m.t === 'fail'){ this.error = m.m; try { w.terminate(); } catch(e){} this.worker = null; this.startMain(); }
      else if (m.t === 'res'){ const p = this.pending[m.id]; if (p){ delete this.pending[m.id]; clearTimeout(p.timer); m.err ? p.rej(new Error(m.err)) : p.res(JSON.parse(m.out)); } }
    };
    w.onerror = () => { if (this.state !== 'ready'){ try { w.terminate(); } catch(e){} this.worker = null; this.startMain(); } };
    return true;
  },
  startMain(){
    if (this.triedMain){ this.state = 'bad'; this.onChange(); return; }
    this.triedMain = true; this.state = 'loading'; this.onChange();
    const fail = e => { this.state = 'bad'; this.error = String((e && e.message) || e || this.error || 'unknown'); this.onChange(); };
    const s = document.createElement('script'); s.src = PYO + 'pyodide.js';
    s.onload = async () => { try { const py = await loadPyodide({indexURL:PYO}); py.runPython(RUNNER_PY); const rj = py.globals.get('run_job'); this.main = async job => { try { await py.loadPackagesFromImports(JSON.parse(job).code); } catch(pe){} return JSON.parse(rj(job)); }; this.state = 'ready'; this.waiters.splice(0).forEach(f => f()); this.onChange(); } catch(e){ fail(e); } };
    s.onerror = () => fail('Could not download the Python engine. Check your connection.');
    document.head.append(s);
    setTimeout(() => { if (this.state === 'loading') this.onChange(); }, 20000);
  },
  reset(){ try { this.worker && this.worker.terminate(); } catch(e){} this.worker = null; this.main = null; this.triedMain = false; this.error = ''; this.state = 'idle'; this.init(); },
  whenReady(){ return this.state === 'ready' ? Promise.resolve() : new Promise(r => this.waiters.push(r)); },
  async run(job){
    if (this.state === 'bad') throw new Error('The Python engine could not start here, so spells cannot run. Tap the red "Python blocked" tag at the top for fixes. (Details: '+(this.error||'unknown')+')');
    await this.whenReady();
    if (this.main) return this.main(JSON.stringify(job));
    return new Promise((res, rej) => {
      const id = ++this.seq;
      const timer = setTimeout(() => { delete this.pending[id]; try { this.worker.terminate(); } catch(e){} this.worker = null; this.state = 'idle'; this.init(); rej(new Error('That took too long, so I reset the spellbook. Try again.')); }, 25000);
      this.pending[id] = {res, rej, timer};
      this.worker.postMessage({id, job:JSON.stringify(job)});
    });
  }
};

  }

function echoPool(){

    if (L.predict && L.predict.opts) pool.push({key:L.id+':p', L, q:L.predict});
    (L.phases||[]).forEach((p,i) => { if (p.type === 'mcq') pool.push({key:L.id+':'+i, L, q:p}); }); });
  return pool;
}

    if (i >= qs.length){
      root.append(h('div',{class:'card',style:'text-align:center'}, h('h2',null,'Echoes done'), h('div',{class:'mpgain'}, '+'+gained+' MP'), h('p',null, right+' of '+qs.length+' correct.'), h('button',{class:'btn block',onclick:() => { go('echo'); }}, 'Done'))); return; }
    const e = qs[i]; const nb = navBtn(i === qs.length-1 ? 'Finish' : 'Next →', () => { i++; show(); }, true);
    const c = h('div',{class:'card'}, h('div',{class:'steptitle'}, h('h2',null,'Echo '+(i+1)+' of '+qs.length), h('span',{class:'tag'}, 'Realm '+e.L.realm)));
    const dummy = {say:() => {}};
    c.append(mcqStep(e.q, {}, {...dummy, onMcq:async r => {
      S.echoSeen[e.key] = Date.now();
      if (r.correct && r.first){ right++; S.stats.echoOK++; if (S.stats.echoOK >= 10) award('echo_keeper'); if (longGap) award('welcome_back'); }
      if (r.correct && r.first && S.echo.n < 5){ const g = 3 + (e.L.realm < maxRealm ? 1 : 0); S.mp += g; gained += g; S.echo.n++; const before = levelFor(S.mp - g); save(); renderHUD(); const after = levelFor(S.mp); toast('🔔','+'+g+' MP','Echo mastered'); for (let l=before+1; l<=after; l++){ if (l===2) award('level2'); await levelUp(l); } }
      else save();
      nb.disabled = false; }}, {retry:false, shuffle:true}), h('div',{class:'nav'}, nb));
    root.append(c);
  }
  show();
}

/* ---------- boot ---------- */
function boot(){
  fx.init(); Py.init();
  ui.view = S.name ? 'map' : 'welcome';
  render();
}
boot();
// test hook
window.__SB__ = {S:()=>S, ui, LESSONS, go, openLesson, render, Py, levelFor, claim};
})();
</script>
